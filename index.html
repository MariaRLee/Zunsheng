<section class="main-section" id="editorial"><div class="shell">${heading('04 · EDITORIAL STANDARDS','來源與編輯原則','Sources and Editorial Principles','學術嚴謹與大眾可讀性同樣重要。','Academic traceability and accessibility matter equally.')}<div class="two-col"><div class="content-card"><h3>${tr('文本與譯文','Text & Translation')}</h3><p>${tr('書目、卷次先以《四庫全書》本核對；原文字形與標點的編輯調整須明示。中文白話譯文以原文為準，不照抄現代出版社的譯著。英文先以逐篇精選導讀呈現，日後再視需要擴充。','Cataloguing uses the Siku Quanshu recension as a reference. Editorial punctuation is declared. Modern-Chinese translations are based on the source text; English provides selected guides rather than falsely claiming a full translation.')}</p></div><div class="content-card"><h3>${tr('現代詮釋與安全性','Interpretation & Context')}</h3><p>${tr('生活美學、SEL、永續等屬現代延伸，不能倒置為作者原意。涉及醫療、長壽、藥方或宇宙觀的說法，均須交代歷史背景與科學證據界線。','Themes such as SEL and sustainability are modern readings, not claims of original authorial intent. Medical, longevity and cosmological claims require historical context and must not be treated as proven science.')}</p></div></div><p class="publication-note">${tr('主要文獻：','Primary reference:')} <a href="${D.source}" target="_blank" rel="noopener noreferrer">${tr('維基文庫《遵生八牋》（四庫全書本）','Wikisource: Zunsheng Bajian (Siku Quanshu)')}</a> · <a href="${D.catalogSource}" target="_blank" rel="noopener noreferrer">${tr('日本國立情報學研究所書誌資料','CiNii Books bibliographic record')}</a></p></div></section>`;
 for(const b of document.querySelectorAll('[data-theme]')) b.addEventListener('click',()=>showTheme(b.dataset.theme));
 const search=el('vol-search'); search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase(); const filtered=D.volumes.filter(v=>{const b=book(v.book);const arts=v.articles.map(article);const blob=[v.num,b.zh,b.en,v.labelZh,v.labelEn,...arts.flatMap(a=>[a.titleZh,a.titleEn,a.leadZh,a.summaryZh,a.original.join(''),a.translation.join('')])].join(' ').toLowerCase();return blob.includes(q)});el('volume-list').innerHTML=filtered.length?filtered.map(volCard).join(''):`<div class="no-results">${tr('查無符合項目（目前僅索引已上架的文字）。','No matches. Only published texts are indexed.')}</div>`;el('search-notice').textContent=tr(`顯示 ${filtered.length} / 15 卷`,`${filtered.length} / 15 volumes shown`);});
}
function showTheme(id){const p=D.pillars.find(p=>p.id===id);if(!p)return;el('theme-detail').innerHTML=`<div class="content-card" style="margin:0"><div class="kicker">${tr('主題探索建議','Suggested reading paths')}</div><h3 style="margin:4px 0 12px">${safe(tr(p.zh,p.en))}</h3><p>${safe(tr(p.descZh,p.descEn))}</p><div class="tag-row">${p.books.map(id=>{let b=book(id);return `<a class="tag" style="text-decoration:none" href="${linkBook(b)}">${safe(tr(b.zh,b.en))} ↗</a>`}).join('')}</div><div class="mini-note">${tr('這是策展對應，不表示相關卷內的每一篇都屬此主題。','These are editorial associations, not classifications of every passage.')}</div></div>`;}
function renderVolume(){const v=vol(volNo);if(!v){el('app').innerHTML='<div class="shell page-body">Volume not found.</div>';return;}const b=book(v.book);const articles=v.articles.map(article).filter(Boolean);
el('app').innerHTML=`<section class="page-head"><div class="shell"><div class="breadcrumb"><a href="${root}index.html">${tr('首頁','Home')}</a> / <a href="${root}index.html#library">${tr('六箋','Collections')}</a> / ${tr('卷','Vol. ')} ${v.num}</div><h1>${safe(tr(b.zh,b.en))} · ${safe(label(v))}</h1><p>${safe(tr(b.descZh,b.descEn))}</p><div class="tag-row"><span class="tag">${tr('原書卷','Original vol.')} ${v.num}</span><span class="tag">${tr('六箋十五卷計畫','Six collections · 15-volume project')}</span></div></div></section><div class="shell page-body"><div class="progress-banner">${articles.length?tr('本卷已有一段完整對照的示範譯文，卷內其他內容仍在編輯中。','One complete passage is available as a sample; the rest of this volume has not been edited.'):tr('本卷卷名與卷次已核對，但尚未發布經校對的篇章原文與白話翻譯。','This volume’s place in the catalog is checked; no fully edited passage has been published here yet.')}</div>${articles.length?`<div class="book-grid" style="grid-template-columns:repeat(auto-fit,minmax(270px,1fr))">${articles.map(a=>`<article class="book-card"><div class="eyebrow" style="color:#5d8d72">${tr('已上架示範段落','Edited sample passage')}</div><h3>${safe(tr(a.titleZh,a.titleEn))}</h3><p class="book-desc" style="margin-top:10px">${safe(tr(a.leadZh,a.leadEn))}</p><p class="mini-note">${safe(tr(a.titleNoteZh,a.titleNoteEn))}</p><div class="book-footer"><a href="${urlArticle(a)}" class="small-link">${tr('閱讀原文與譯文','Read original & translation')} →</a></div></article>`).join('')}</div>`:`<div class="empty-state"><div style="font:42px var(--serif);color:#8dab95">卷</div><h2>${tr('內容尚在校訂','Content not yet published')}</h2><p>${tr('為避免錯誤，我們不以摘要代替尚未校對的古文，也不預填未確認的篇目。您可以先查閱對應原典。','To protect accuracy, this page does not invent passages, translations or unverified chapter titles. You can consult the source text for now.')}</p><a href="${D.source}" class="btn btn-outline" target="_blank" rel="noopener noreferrer">${tr('查閱原文出處','Consult original source')} ↗</a></div>`}<hr class="subtle-rule"><h2>${tr('同箋其他卷次','Other Volumes in this Collection')}</h2>${bookVolumeNav(b)}<div class="source-links"><a href="${D.source}" target="_blank" rel="noopener noreferrer">${tr('版本與卷目出處：四庫全書本','Source: Siku Quanshu text')} ↗</a></div><p class="publication-note">${tr('卷名已核對，細部篇目將逐篇補充；未公開內容不代表古書缺頁。','Volume headings are verified. Unpublished sections reflect our editorial progress, not missing material in the original book.')}</p></div>`;
}
function renderArticle(){const a=article(articleId);if(!a){el('app').innerHTML='<div class="shell page-body">Article not found.</div>';return;}const b=book(a.book),v=vol(a.volume);
const noteItem=(n)=>`<div class="note-item"><dt>${safe(n.term)}</dt><dd>${safe(tr(n.definitionZh,n.definitionEn))}</dd></div>`;
el('app').innerHTML=`<section class="page-head"><div class="shell"><div class="breadcrumb"><a href="${root}index.html">${tr('首頁','Home')}</a> / <a href="${urlVol(v)}">${safe(tr(b.zh,b.en))} · ${tr('卷','Vol.')} ${v.num}</a> / ${tr('開篇段落','Opening passage')}</div><div class="eyebrow" style="color:#60806c;margin-top:15px">${tr('原文對照・編輯示範','EDITED BILINGUAL READING SAMPLE')}</div><h1>${safe(tr(a.titleZh,a.titleEn))}</h1><p>${safe(tr(a.leadZh,a.leadEn))}</p><div class="tag-row">${a.pillars.map(id=>{let p=D.pillars.find(i=>i.id===id);return `<span class="tag">${safe(tr(p.zh,p.en))}</span>`}).join('')}<span class="tag">${tr('原書卷一','Original Vol. I')}</span></div></div></section>
<div class="shell page-body"><div class="content-split"><main><img src="${gardenImage}" class="article-image" alt="${tr('竹影、書房與遠山湖水的彩色意境圖，無人物與文字','Illustrated lakeside study, bamboo and mountains with no people or text')}"><p class="publication-note">${safe(tr(a.titleNoteZh,a.titleNoteEn))}</p><div class="content-card" id="original"><div class="kicker">01 · CLASSICAL TEXT</div><h2>${tr('古籍原文','Classical Chinese Text')}</h2><p class="mini-note">${safe(a.originalTitle)} · ${tr('據四庫全書本整理標點','Punctuation supplied by editor')}</p><div class="classical">${a.original.map(x=>`<p>${safe(x)}</p>`).join('')}</div></div>
<div class="content-card" id="translation"><div class="kicker">02 · MODERN CHINESE</div><h2>${tr('完整白話翻譯（本段）','Full Modern-Chinese Translation (This Passage)')}</h2>${a.translation.map(x=>`<p class="modern">${safe(x)}</p>`).join('')}<div class="context-warning">${tr('「完整」只指此處選定的開篇段落；不是《清修妙論箋》全卷翻譯。','“Full” means the opening passage shown above, not the complete volume.')}</div></div>
<div class="content-card" id="english"><div class="kicker">03 · ENGLISH HIGHLIGHTS</div><h2>English Highlights</h2><p>${safe(a.summaryEn)}</p><p class="publication-note">${tr('英文為精選導讀，非原文逐句英譯。','English is a concise editorial introduction, not a line-by-line translation.')}</p></div>
<div class="content-card" id="notes"><div class="kicker">04 · HISTORICAL CONTEXT</div><h2>${tr('文化背景與詞語註解','Cultural Notes')}</h2><div class="note-list">${a.notes.map(noteItem).join('')}</div></div>
<div class="content-card" id="wisdom"><div class="kicker">05 · MODERN REFLECTION</div><h2>${tr('核心智慧與今日反思','Life Wisdom & Reflection')}</h2><p class="quote-line">${safe(tr(a.summaryZh,'Understanding a principle matters; putting it into practice brings it into life.'))}</p><div class="reflection-panel"><div><strong>${tr('想一想','Reflection question')}</strong><p>${safe(tr(a.reflectionQZh,a.reflectionQEn))}</p></div><div class="answer"><strong>${tr('參考思考方向（不是唯一答案）','Suggested perspective (not the only answer)')}</strong><p>${safe(tr(a.reflectionAZh,a.reflectionAEn))}</p></div><div class="answer"><strong>${tr('古人智慧，今日實踐','Ancient Wisdom, Modern Practice')}</strong><p style="margin-bottom:0">${safe(tr(a.practiceZh,a.practiceEn))}</p></div></div><div class="context-warning" style="margin-top:19px">${safe(tr(a.cautionZh,a.cautionEn))}</div></div>
<div class="content-card" id="source"><div class="kicker">06 · SOURCES</div><h2>${tr('文獻來源與校訂說明','Source & Editorial Record')}</h2><p>${tr('原文出處：明・高濂《遵生八牋》卷一〈清修妙論牋上〉開篇「髙子曰」段。本站根據《欽定四庫全書》本電子文本核對，新增標點、引號與閱讀分段；白話譯文、英文導讀、今人反思均為本站新撰，不冒充原文。','Original source: Gao Lian, Zunsheng Bajian, Volume I, opening “Gaozi yue” passage. The source is checked against the Siku Quanshu transcription. Punctuation is editorial. Translation and modern reflection are new writing and not part of the historical text.')}</p><div class="source-links"><a href="${a.sourceUrl}" target="_blank" rel="noopener noreferrer">${tr('查看四庫全書本文本','View the Siku Quanshu source')} ↗</a><a href="${D.catalogSource}" target="_blank" rel="noopener noreferrer">${tr('書目卷次查證','Verify volume catalog')} ↗</a></div></div></main>
<aside class="content-card sidecard"><h3>${tr('本篇導覽','On this page')}</h3><a href="#original">01 ${tr('原文','Classical Chinese')}</a><a href="#translation">02 ${tr('白話文','Modern Chinese')}</a><a href="#english">03 English Highlights</a><a href="#notes">04 ${tr('文化註解','Cultural Notes')}</a><a href="#wisdom">05 ${tr('生活反思','Modern Reflection')}</a><a href="#source">06 ${tr('文獻來源','Sources')}</a><hr class="subtle-rule"><p class="mini-note">${tr('本站僅完成卷一的這一段示範；不將它標為全卷完成。','This is one edited opening passage, not all of Volume I.')}</p><a class="btn btn-outline" style="display:flex" href="${urlVol(v)}">${tr('返回卷一','Back to Volume I')}</a></aside></div></div>`;
}
function render(){header();footer();renderDescription();if(page==='home')renderHome();else if(page==='volume')renderVolume();else renderArticle();document.title=(page==='home'?tr('遵生八箋｜古典智慧與美好永續生活','Zunsheng Bajian | Classical Wisdom for Better Living'):page==='volume'?`${tr('卷','Vol. ')}${volNo} · ${tr(book(vol(volNo)?.book)?.zh||'',book(vol(volNo)?.book)?.en||'')}`:`${tr(article(articleId)?.titleZh||'',article(articleId)?.titleEn||'')}`)+' | Zunsheng Bajian';}
render();
})();

</script>
